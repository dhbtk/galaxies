server {
    listen 80;
    listen [::]:80;
    server_name galaxies.dhbtk.com;

    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    # Match the listen options of the other home-server virtual hosts.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name galaxies.dhbtk.com;
    ssl_certificate /etc/letsencrypt/live/galaxies.dhbtk.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/galaxies.dhbtk.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
